[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asyncio-util"
dynamic = ["version"]
description = "Utilities for asyncio, ported from trio-util: awaitable values, cancel scopes, repeated events, and more"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
  "asyncio",
  "async",
  "await",
  "event",
  "state",
  "synchronization",
  "concurrency",
  "trio-util",
]
authors = [
  { name = "Junya Fukuda", email = "junya.fukuda.e@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://jrfk.github.io/asyncio-util/"
Issues = "https://github.com/jrfk/asyncio-util/issues"
Source = "https://github.com/jrfk/asyncio-util"

[dependency-groups]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "coverage[toml]>=7.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-static-i18n>=1.2",
  "mkdocstrings[python]>=0.27",
]

[tool.hatch.version]
path = "src/asyncio_util/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/asyncio_util tests}"

[tool.hatch.envs.docs]
dependencies = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-static-i18n>=1.2",
  "mkdocstrings[python]>=0.27",
]
[tool.hatch.envs.docs.scripts]
build = "mkdocs build --strict {args}"
serve = "mkdocs serve {args}"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source_pkgs = ["asyncio_util", "tests"]
branch = true
parallel = true
omit = [
  "src/asyncio_util/__about__.py",
]

[tool.coverage.paths]
asyncio_util = ["src/asyncio_util", "*/asyncio-util/src/asyncio_util"]
tests = ["tests", "*/asyncio-util/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.envs.hatch-test]
extra-dependencies = [
  "pytest",
  "pytest-asyncio",
]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]
